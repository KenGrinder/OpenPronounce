name: Publish to PyPI

# Runs when a v* tag is pushed, or when dispatched on a tag by the Release workflow
# (PyPI trusted publishing does not support reusable workflows, so this must be the
# top-level workflow). Trusted publisher on pypi.org: owner Halleck45, repository
# OpenPronounce, workflow publish.yml, environment pypi.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    # Only the repository that owns the PyPI trusted-publisher relationship can
    # publish, and that is upstream (see the note above). A fork tagging v* wants
    # a versioned container image, which container.yml already builds from the
    # same tag -- it does not want three jobs failing against a trusted publisher
    # bound to someone else's repository and a `pypi` environment it has never
    # created. `publish` and `release` chain off this one, so both skip with it.
    if: github.repository == 'Halleck45/OpenPronounce'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check that the ref is a tag matching pyproject version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "${{ github.ref_type }}" = "tag" || { echo "must run on a tag, not $TAG"; exit 1; }
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$TAG" || { echo "tag $TAG != v$version"; exit 1; }
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
